# Include in nginx http context. Replace domain and certificate paths; verify with nginx -t.
# Keep port 17841 inaccessible externally. This vhost serves ONLY cookie/MFA browser APIs on 17842.
limit_req_zone $binary_remote_addr zone=lsp_web_login:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=lsp_web_reauth:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=lsp_web_all:10m rate=5r/s;
upstream lsp_web_backend { server 127.0.0.1:17842; keepalive 8; }
server {
    listen 80;
    server_name admin.example.com;
    return 301 https://admin.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name admin.example.com;
    ssl_certificate /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 32k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    keepalive_timeout 20s;
    access_log off;
    limit_req_status 429;
    location = /api/login {
        limit_req zone=lsp_web_login burst=6 nodelay;
        limit_except POST { deny all; }
        include /etc/nginx/snippets/lsp-admin-proxy.conf;
    }
    # Separate ingress budget: anonymous login saturation must not exhaust recent MFA.
    # Backend still authenticates the session/CSRF and applies its own per-session budget.
    location = /api/reauth {
        limit_req zone=lsp_web_reauth burst=6 nodelay;
        limit_except POST { deny all; }
        include /etc/nginx/snippets/lsp-admin-proxy.conf;
    }
    location / {
        limit_req zone=lsp_web_all burst=20 nodelay;
        include /etc/nginx/snippets/lsp-admin-proxy.conf;
    }
}

# One HTTPS origin for browser administration and the public client API.
# Replace the example hostname, certificate paths and ACME webroot before installation.
# Install in nginx's http context. Ports 17840-17842 must remain loopback-only.
limit_req_zone $binary_remote_addr zone=lsp_license_ip:2m rate=20r/s;
limit_req_zone $binary_remote_addr zone=lsp_web_login:2m rate=2r/m;
limit_req_zone $binary_remote_addr zone=lsp_web_reauth:2m rate=2r/m;
limit_req_zone $binary_remote_addr zone=lsp_web_all:2m rate=5r/s;
upstream lsp_license_backend { server 127.0.0.1:17840; keepalive 8; }
upstream lsp_web_backend { server 127.0.0.1:17842; keepalive 8; }

server {
    listen 80;
    server_name toolkit.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/lsptool-acme/www;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://toolkit.example.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name toolkit.example.com;
    ssl_certificate /etc/letsencrypt/live/toolkit.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toolkit.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 32k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    keepalive_timeout 20s;
    access_log off;
    limit_req_status 429;

    location = /api/login {
        limit_req zone=lsp_web_login burst=6 nodelay;
        limit_except POST { deny all; }
        include /etc/nginx/snippets/lsp-admin-proxy.conf;
    }
    location = /api/reauth {
        limit_req zone=lsp_web_reauth burst=6 nodelay;
        limit_except POST { deny all; }
        include /etc/nginx/snippets/lsp-admin-proxy.conf;
    }
    location /v1/ {
        limit_except POST { deny all; }
        limit_req zone=lsp_license_ip burst=40 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:17840;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_request_buffering on;
        proxy_cache off;
        proxy_pass http://lsp_license_backend;
    }
    location = /health {
        limit_except GET { deny all; }
        limit_req zone=lsp_license_ip burst=5 nodelay;
        proxy_set_header Host 127.0.0.1:17840;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_cache off;
        proxy_pass http://lsp_license_backend;
    }
    location /admin/ { return 404; }
    location / {
        limit_req zone=lsp_web_all burst=20 nodelay;
        include /etc/nginx/snippets/lsp-admin-proxy.conf;
    }
}

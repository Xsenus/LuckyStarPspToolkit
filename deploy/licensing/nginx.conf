# Install in http-context, e.g. /etc/nginx/conf.d/lsptool-license.conf.
# Replace the example domain and certificate paths. Never proxy port 17841.
limit_req_zone $binary_remote_addr zone=lsp_license_ip:10m rate=20r/s;
upstream lsp_license_backend {
    server 127.0.0.1:17840;
    keepalive 16;
}
server {
    listen 80;
    server_name licenses.example.com;
    return 301 https://licenses.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name licenses.example.com;
    ssl_certificate /etc/letsencrypt/live/licenses.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/licenses.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    keepalive_timeout 20s;
    limit_req_status 429;
    access_log off;

    location /v1/ {
        limit_except POST { deny all; }
        limit_req zone=lsp_license_ip burst=40 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:17840;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_request_buffering on;
        proxy_cache off;
        proxy_pass http://lsp_license_backend;
    }
    location = /health {
        limit_except GET { deny all; }
        limit_req zone=lsp_license_ip burst=5 nodelay;
        proxy_set_header Host 127.0.0.1:17840;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_cache off;
        proxy_pass http://lsp_license_backend;
    }
    location / { return 404; }
}

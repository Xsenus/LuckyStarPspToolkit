name: Feature request
description: Propose a workflow, format, safety, or documentation improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: Format and safety invariants
      description: Explain offsets, checksums, revision checks, bounds, and failure behavior when applicable.
  - type: textarea
    id: tests
    attributes:
      label: Suggested synthetic tests or public references
  - type: checkboxes
    id: legal
    attributes:
      label: Asset policy
      options:
        - label: The proposal does not require committing proprietary game, firmware, font, or translation assets.
          required: true

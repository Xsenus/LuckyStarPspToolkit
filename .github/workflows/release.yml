name: tag-release-preview

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag must match VERSION" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
  publish:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -r validation/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and build pinned React owner console
        run: |
          node web/license-admin/test.mjs
          node web/license-admin/build.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Materialize PUBLIC issuer configuration
        env:
          LSP_PUBLIC_TRUST: ${{ vars.LSP_LICENSE_TRUST_JSON }}
        shell: python
        run: |
          import os, pathlib
          data = os.environ.get("LSP_PUBLIC_TRUST", "")
          if not data:
              raise SystemExit("Set PUBLIC repository variable LSP_LICENSE_TRUST_JSON from client-trust.json; never put authority secrets here")
          path = pathlib.Path("artifacts/customer-public-trust.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(data, encoding="utf-8")
      - name: Reject development trust and private issuer files
        run: python scripts/license_build_profile.py artifacts/customer-public-trust.json
      - name: Checked native build, licensing lifecycle and configured customer publish
        run: python scripts/build_release.py --rids ${{ matrix.rid }} --license-trust artifacts/customer-public-trust.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: |
            artifacts/releases/*/*.zip
            artifacts/releases/*/*.zip.sha256
          if-no-files-found: error
      - name: Keep diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.rid }}
          path: |
            artifacts/build-logs
            artifacts/demo
          if-no-files-found: warn
  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify-version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify package digests
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c *.sha256
      - name: Create reviewable engineering preview (not a finished game patch)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
            --title "Lucky Star PSP Toolkit ${{ needs.verify-version.outputs.version }} — engineering preview" \
            --notes "Native CI build/tests and synthetic demo passed. Online license activation on the deployed issuer and actual game acceptance are separate. Review THIRD_PARTY_NOTICES.md before making this release public."

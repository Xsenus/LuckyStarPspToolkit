name: owner-private-packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner:
    if: github.event.repository.private
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: python -m pip install -r validation/requirements.txt
      - run: python scripts/build_license_owner.py --rids ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: OWNER-ONLY-${{ matrix.rid }}
          path: |
            artifacts/owner-releases/*/*.zip
            artifacts/owner-releases/*/*.zip.sha256
            artifacts/owner-releases/*/build-report.json
          if-no-files-found: error

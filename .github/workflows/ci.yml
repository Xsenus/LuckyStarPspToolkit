name: build-test-package

on:
  push:
    branches: [main, master, 'develop/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-release-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install development validators
        run: python -m pip install --disable-pip-version-check -r validation/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and build pinned React owner console
        run: |
          node web/license-admin/test.mjs
          node web/license-admin/build.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Checked build, licensing lifecycle, licensed synthetic demo and LOCKED preview
        run: python scripts/build_release.py --rids ${{ matrix.rid }}
      - name: Upload validated packages
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.rid }}
          path: |
            artifacts/releases/*/*.zip
            artifacts/releases/*/*.zip.sha256
            artifacts/releases/*/build-report.json
          if-no-files-found: error
      - name: Upload diagnostic logs (also after failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.rid }}
          path: |
            artifacts/build-logs
            artifacts/demo
          if-no-files-found: warn

  browser-owner-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install browser test tools
        run: |
          python -m pip install -r validation/requirements.txt -r web/license-admin/requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Build actual browser and backend
        run: |
          node web/license-admin/test.mjs
          node web/license-admin/build.mjs
          dotnet build LuckyStarPspToolkit.sln -c Release --nologo
      - name: Native browser transport, MFA and reserve lifecycle
        run: python scripts/web_reserve_integration.py --output artifacts/browser-ci
      - name: Upload redacted browser evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-browser-evidence
          path: |
            artifacts/browser-ci/*.log
            artifacts/browser-ci/*.png
            artifacts/browser-ci/web-reserve-integration-report.json
          if-no-files-found: warn
